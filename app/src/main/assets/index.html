<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#16181d">
<title>Kanban</title>
<style>
:root{
  --bg:#f3f4f7;--panel:#e7e9ee;--card:#ffffff;--text:#1b1d22;--muted:#6b7080;
  --line:#d5d8e0;--accent:#3b6ef5;--danger:#d64545;--shadow:0 1px 2px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#16181d;--panel:#1f222a;--card:#2a2e38;--text:#eceef3;--muted:#9aa0ae;
  --line:#353a46;--accent:#6b93ff;--danger:#ff6b6b;--shadow:0 1px 2px rgba(0,0,0,.4)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:15px/1.4 system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;padding-top:max(12px,env(safe-area-inset-top))}
header h1{font-size:19px;margin:0;flex:1;font-weight:650;letter-spacing:.2px}
.iconbtn{border:0;background:var(--panel);color:var(--text);border-radius:10px;
  min-width:40px;height:40px;padding:0 12px;font-size:15px;font-weight:600}
.iconbtn:active{opacity:.7}
#search{margin:0 14px 8px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--text);font-size:15px;display:none}
#search.show{display:block}
#board{flex:1;display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;padding:4px 14px 16px;
  scroll-snap-type:x mandatory;scroll-padding:14px}
.col{flex:0 0 86vw;max-width:360px;background:var(--panel);border-radius:14px;display:flex;
  flex-direction:column;max-height:100%;scroll-snap-align:start}
.colhead{display:flex;align-items:center;gap:8px;padding:12px 12px 6px}
.colhead .dot{width:10px;height:10px;border-radius:50%}
.colhead h2{font-size:15px;margin:0;flex:1;font-weight:650}
.colhead .count{color:var(--muted);font-size:13px}
.colhead button{border:0;background:none;color:var(--muted);font-size:20px;padding:0 6px;height:30px}
.cards{flex:1;overflow-y:auto;padding:4px 10px 6px;min-height:60px}
.card{background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow);
  border-left:4px solid transparent;user-select:none;-webkit-user-select:none}
.card .t{font-weight:560;word-break:break-word}
.card .n{color:var(--muted);font-size:13px;margin-top:3px;white-space:pre-wrap;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{display:flex;gap:8px;margin-top:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.badge{padding:1px 7px;border-radius:6px;background:var(--panel)}
.badge.over{background:var(--danger);color:#fff}
.card.dragging{opacity:.35}
.ghost{position:fixed;pointer-events:none;z-index:50;transform:rotate(2deg);opacity:.95;
  box-shadow:0 8px 24px rgba(0,0,0,.25)}
.placeholder{height:44px;border:2px dashed var(--accent);border-radius:10px;margin-bottom:8px;opacity:.6}
.addcard{margin:0 10px 10px;border:0;background:none;color:var(--muted);text-align:left;
  padding:10px 4px;font-size:15px;font-weight:600}
.addcol{flex:0 0 60vw;max-width:260px;border:2px dashed var(--line);border-radius:14px;background:none;
  color:var(--muted);font-size:15px;font-weight:600;height:56px;scroll-snap-align:start}
/* Dialog */
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:100;align-items:flex-end}
.sheetbg.open{display:flex}
.sheet{background:var(--card);width:100%;border-radius:18px 18px 0 0;padding:16px 16px;
  padding-bottom:max(16px,env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto}
.sheet h3{margin:0 0 12px;font-size:17px}
.sheet label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.sheet input,.sheet textarea,.sheet select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--text);font:inherit}
.sheet textarea{min-height:90px;resize:vertical}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid transparent}
.sw.sel{border-color:var(--text)}
.sw.none{background:var(--panel);position:relative}
.sw.none::after{content:"";position:absolute;left:4px;right:4px;top:50%;height:2px;background:var(--muted);transform:rotate(-45deg)}
.row{display:flex;gap:10px;margin-top:18px}
.row button{flex:1;height:46px;border-radius:12px;border:0;font:inherit;font-weight:650}
.primary{background:var(--accent);color:#fff}
.secondary{background:var(--panel);color:var(--text)}
.danger{background:none;color:var(--danger)}
.menu button{display:block;width:100%;text-align:left;padding:14px 4px;border:0;border-bottom:1px solid var(--line);
  background:none;color:var(--text);font:inherit}
.menu button:last-child{border-bottom:0}
.menu button.danger{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;
  padding:10px 16px;border-radius:10px;font-size:14px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1 id="boardTitle">Kanban</h1>
  <button class="iconbtn" id="btnSearch" aria-label="Suchen">Suche</button>
  <button class="iconbtn" id="btnMenu" aria-label="Menü">&#8942;</button>
</header>
<input id="search" type="search" placeholder="Karten durchsuchen ...">
<main id="board"></main>

<div class="sheetbg" id="sheetbg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="application/json,.json" style="display:none">

<script>
(function(){
const KEY="kanban.v1";
const COLORS=["#e5484d","#f76b15","#f5b800","#30a46c","#12a594","#3b6ef5","#8e4ec6","#d6409f"];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function defaultState(){
  return {title:"Kanban",columns:[
    {id:uid(),name:"Zu erledigen",color:"#3b6ef5",cards:[]},
    {id:uid(),name:"In Arbeit",color:"#f5b800",cards:[]},
    {id:uid(),name:"Erledigt",color:"#30a46c",cards:[]}
  ]};
}
let state;
try{ state=JSON.parse(localStorage.getItem(KEY)) }catch(e){}
if(!state||!Array.isArray(state.columns)) state=defaultState();
function save(){ try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast("Speichern fehlgeschlagen")} }

const $=s=>document.querySelector(s);
const board=$("#board"), sheetbg=$("#sheetbg"), sheet=$("#sheet");
let filter="";

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1800)}
function fmtDate(d){ if(!d) return ""; const [y,m,dd]=d.split("-"); return dd+"."+m+"."+y }
function isOver(d){ if(!d) return false; const t=new Date(); t.setHours(0,0,0,0); return new Date(d+"T00:00:00")<t }
function findCard(id){ for(const c of state.columns){const i=c.cards.findIndex(k=>k.id===id); if(i>-1) return {col:c,idx:i,card:c.cards[i]} } }

function render(){
  $("#boardTitle").textContent=state.title||"Kanban";
  const sx=board.scrollLeft;
  const scrolls={}; board.querySelectorAll(".cards").forEach(el=>scrolls[el.dataset.col]=el.scrollTop);
  board.innerHTML="";
  const f=filter.trim().toLowerCase();
  state.columns.forEach(col=>{
    const el=document.createElement("section"); el.className="col"; el.dataset.col=col.id;
    const cards=col.cards.filter(k=>!f||(k.title+" "+(k.notes||"")).toLowerCase().includes(f));
    el.innerHTML=`<div class="colhead"><span class="dot" style="background:${col.color||"var(--muted)"}"></span>
      <h2>${esc(col.name)}</h2><span class="count">${col.cards.length}</span>
      <button data-colmenu="${col.id}" aria-label="Spaltenmenü">&#8942;</button></div>
      <div class="cards" data-col="${col.id}"></div>
      <button class="addcard" data-add="${col.id}">+ Karte hinzufügen</button>`;
    const list=el.querySelector(".cards");
    cards.forEach(k=>{
      const c=document.createElement("div"); c.className="card"; c.dataset.id=k.id;
      if(k.color) c.style.borderLeftColor=k.color;
      let meta="";
      if(k.due) meta+=`<span class="badge ${isOver(k.due)&&!k.doneAt?"over":""}">${fmtDate(k.due)}</span>`;
      c.innerHTML=`<div class="t">${esc(k.title)}</div>${k.notes?`<div class="n">${esc(k.notes)}</div>`:""}${meta?`<div class="meta">${meta}</div>`:""}`;
      list.appendChild(c);
    });
    board.appendChild(el);
  });
  const add=document.createElement("button"); add.className="addcol"; add.textContent="+ Spalte"; add.onclick=()=>editColumn(null);
  board.appendChild(add);
  board.scrollLeft=sx;
  board.querySelectorAll(".cards").forEach(el=>{ if(scrolls[el.dataset.col]) el.scrollTop=scrolls[el.dataset.col] });
}

/* ---------- Sheets ---------- */
function openSheet(html){ sheet.innerHTML=html; sheetbg.classList.add("open"); history.pushState({sheet:1},""); }
function closeSheet(fromPop){ if(!sheetbg.classList.contains("open")) return; sheetbg.classList.remove("open"); sheet.innerHTML=""; if(!fromPop) history.back(); }
sheetbg.addEventListener("click",e=>{ if(e.target===sheetbg) closeSheet() });
window.addEventListener("popstate",()=>closeSheet(true));

function colorPicker(sel){
  return `<div class="colors"><button type="button" class="sw none ${!sel?"sel":""}" data-c=""></button>`+
    COLORS.map(c=>`<button type="button" class="sw ${sel===c?"sel":""}" data-c="${c}" style="background:${c}"></button>`).join("")+`</div>`;
}
function bindColors(){ let v=sheet.querySelector(".sw.sel")?.dataset.c||"";
  sheet.querySelectorAll(".sw").forEach(b=>b.onclick=()=>{sheet.querySelectorAll(".sw").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");v=b.dataset.c});
  return ()=>v; }

function editCard(cardId,colId){
  const found=cardId?findCard(cardId):null;
  const k=found?found.card:{title:"",notes:"",color:"",due:""};
  const curCol=found?found.col.id:colId;
  openSheet(`<h3>${found?"Karte bearbeiten":"Neue Karte"}</h3>
    <label>Titel</label><input id="fTitle" value="${esc(k.title)}" maxlength="200">
    <label>Notizen</label><textarea id="fNotes">${esc(k.notes)}</textarea>
    <label>Fällig am</label><input id="fDue" type="date" value="${esc(k.due)}">
    <label>Spalte</label><select id="fCol">${state.columns.map(c=>`<option value="${c.id}" ${c.id===curCol?"selected":""}>${esc(c.name)}</option>`).join("")}</select>
    <label>Farbe</label>${colorPicker(k.color)}
    <div class="row"><button class="secondary" id="bCancel">Abbrechen</button><button class="primary" id="bSave">Speichern</button></div>
    ${found?`<div class="row"><button class="danger" id="bDel">Karte löschen</button></div>`:""}`);
  const getColor=bindColors();
  const t=$("#fTitle"); if(!found) setTimeout(()=>t.focus(),50);
  $("#bCancel").onclick=()=>closeSheet();
  $("#bSave").onclick=()=>{
    const title=t.value.trim(); if(!title){t.focus();return}
    const data={title,notes:$("#fNotes").value.trim(),due:$("#fDue").value,color:getColor()};
    const target=state.columns.find(c=>c.id===$("#fCol").value);
    if(found){ Object.assign(found.card,data);
      if(target.id!==found.col.id){ found.col.cards.splice(found.idx,1); target.cards.push(found.card) } }
    else target.cards.push({id:uid(),created:Date.now(),...data});
    save(); render(); closeSheet();
  };
  if(found) $("#bDel").onclick=()=>{ if(confirm("Karte wirklich löschen?")){ found.col.cards.splice(found.idx,1); save(); render(); closeSheet(); toast("Karte gelöscht") } };
}

function editColumn(colId){
  const col=colId?state.columns.find(c=>c.id===colId):null;
  openSheet(`<h3>${col?"Spalte bearbeiten":"Neue Spalte"}</h3>
    <label>Name</label><input id="fName" value="${esc(col?col.name:"")}" maxlength="60">
    <label>Farbe</label>${colorPicker(col?col.color:COLORS[5])}
    <div class="row"><button class="secondary" id="bCancel">Abbrechen</button><button class="primary" id="bSave">Speichern</button></div>`);
  const getColor=bindColors(); const n=$("#fName"); if(!col) setTimeout(()=>n.focus(),50);
  $("#bCancel").onclick=()=>closeSheet();
  $("#bSave").onclick=()=>{ const name=n.value.trim(); if(!name){n.focus();return}
    if(col){col.name=name;col.color=getColor()} else state.columns.push({id:uid(),name,color:getColor(),cards:[]});
    save(); render(); closeSheet(); };
}

function columnMenu(colId){
  const i=state.columns.findIndex(c=>c.id===colId), col=state.columns[i];
  openSheet(`<h3>${esc(col.name)}</h3><div class="menu">
    <button data-a="edit">Umbenennen / Farbe</button>
    ${i>0?`<button data-a="left">Nach links verschieben</button>`:""}
    ${i<state.columns.length-1?`<button data-a="right">Nach rechts verschieben</button>`:""}
    ${col.cards.length?`<button data-a="clear">Alle Karten dieser Spalte löschen</button>`:""}
    <button data-a="del" class="danger">Spalte löschen</button></div>`);
  sheet.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.a;
    if(a==="edit"){ closeSheet(); setTimeout(()=>editColumn(colId),10); return }
    if(a==="left"||a==="right"){ const j=a==="left"?i-1:i+1; [state.columns[i],state.columns[j]]=[state.columns[j],state.columns[i]] }
    if(a==="clear"){ if(!confirm(`${col.cards.length} Karten löschen?`)) return; col.cards=[] }
    if(a==="del"){ if(!confirm(col.cards.length?`Spalte mit ${col.cards.length} Karten löschen?`:"Spalte löschen?")) return; state.columns.splice(i,1) }
    save(); render(); closeSheet();
  });
}

function mainMenu(){
  openSheet(`<h3>Menü</h3><div class="menu">
    <button data-a="title">Board umbenennen</button>
    <button data-a="export">Backup exportieren (JSON)</button>
    <button data-a="import">Backup importieren</button>
    <button data-a="reset" class="danger">Alles löschen</button></div>`);
  sheet.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.a;
    if(a==="title"){ const t=prompt("Name des Boards:",state.title); if(t&&t.trim()){state.title=t.trim();save();render()} closeSheet() }
    if(a==="export"){ exportData(); closeSheet() }
    if(a==="import"){ closeSheet(); $("#fileIn").click() }
    if(a==="reset"){ if(confirm("Wirklich alle Spalten und Karten löschen?")){ state=defaultState(); save(); render(); closeSheet(); toast("Board zurückgesetzt") } }
  });
}

function exportData(){
  const json=JSON.stringify(state,null,2);
  const name="kanban-backup-"+new Date().toISOString().slice(0,10)+".json";
  if(window.AndroidBridge&&AndroidBridge.saveFile){ AndroidBridge.saveFile(name,json); return }
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));
  a.download=name; document.body.appendChild(a); a.click(); a.remove(); toast("Backup gespeichert");
}
function importData(text){
  try{ const s=JSON.parse(text); if(!s||!Array.isArray(s.columns)) throw 0;
    if(!confirm("Aktuelles Board durch das Backup ersetzen?")) return;
    state=s; save(); render(); toast("Backup importiert");
  }catch(e){ toast("Datei ist kein gültiges Backup") }
}
window.kanbanImport=importData;
$("#fileIn").onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>importData(r.result); r.readAsText(f); e.target.value="" };

/* ---------- Events ---------- */
$("#btnMenu").onclick=mainMenu;
$("#btnSearch").onclick=()=>{ const s=$("#search"); s.classList.toggle("show"); if(s.classList.contains("show")) s.focus(); else {s.value="";filter="";render()} };
$("#search").oninput=e=>{filter=e.target.value;render()};
board.addEventListener("click",e=>{
  if(dragJustEnded) return;
  const add=e.target.closest("[data-add]"); if(add) return editCard(null,add.dataset.add);
  const cm=e.target.closest("[data-colmenu]"); if(cm) return columnMenu(cm.dataset.colmenu);
  const card=e.target.closest(".card"); if(card) return editCard(card.dataset.id);
});

/* ---------- Drag & Drop (lange drücken) ---------- */
let press=null, drag=null, dragJustEnded=false, autoTimer=null;
board.addEventListener("pointerdown",e=>{
  const card=e.target.closest(".card"); if(!card||filter||drag) return;
  press={card,ox:e.clientX,oy:e.clientY,
    timer:setTimeout(()=>startDrag(card,press.ox,press.oy),380)};
});
board.addEventListener("pointermove",e=>{
  if(press&&!drag&&(Math.abs(e.clientX-press.ox)>8||Math.abs(e.clientY-press.oy)>8)) cancelPress();
},{passive:true});
function cancelPress(){ if(press){clearTimeout(press.timer);press=null} }
board.addEventListener("scroll",cancelPress,true);
document.addEventListener("pointerup",e=>{ if(drag) endDrag(); cancelPress() });
document.addEventListener("pointercancel",e=>{ if(drag) endDrag(); cancelPress() });

function startDrag(card,x,y){
  if(!press) return; press=null;
  if(navigator.vibrate) navigator.vibrate(25);
  const r=card.getBoundingClientRect();
  const ghost=card.cloneNode(true); ghost.classList.add("ghost");
  ghost.style.width=r.width+"px"; ghost.style.left=r.left+"px"; ghost.style.top=r.top+"px";
  document.body.appendChild(ghost);
  const ph=document.createElement("div"); ph.className="placeholder"; ph.style.height=r.height+"px";
  card.after(ph); card.classList.add("dragging");
  drag={card,ghost,ph,dx:x-r.left,dy:y-r.top,x,y};
  board.style.scrollSnapType="none"; board.style.overflowX="hidden";
  document.querySelectorAll(".cards").forEach(l=>l.style.overflowY="hidden");
  document.addEventListener("touchmove",blockTouch,{passive:false});
  document.addEventListener("pointermove",onDragMove);
  autoTimer=setInterval(autoScroll,16);
}
function blockTouch(e){ e.preventDefault() }
function onDragMove(e){
  if(!drag) return; drag.x=e.clientX; drag.y=e.clientY;
  drag.ghost.style.left=(e.clientX-drag.dx)+"px"; drag.ghost.style.top=(e.clientY-drag.dy)+"px";
  placePlaceholder();
}
function placePlaceholder(){
  const el=document.elementFromPoint(drag.x,drag.y); if(!el) return;
  const colEl=el.closest(".col"); if(!colEl) return;
  const list=colEl.querySelector(".cards");
  const cards=[...list.querySelectorAll(".card:not(.dragging)")];
  let before=null;
  for(const c of cards){ const r=c.getBoundingClientRect(); if(drag.y<r.top+r.height/2){before=c;break} }
  if(before) list.insertBefore(drag.ph,before); else list.appendChild(drag.ph);
}
function autoScroll(){
  if(!drag) return; const w=window.innerWidth, edge=40;
  if(drag.x<edge) board.scrollLeft-=12; else if(drag.x>w-edge) board.scrollLeft+=12;
  const el=document.elementFromPoint(drag.x,drag.y); const list=el&&el.closest(".col")?.querySelector(".cards");
  if(list){ const r=list.getBoundingClientRect();
    if(drag.y<r.top+36) list.scrollTop-=10; else if(drag.y>r.bottom-36) list.scrollTop+=10; }
  placePlaceholder();
}
function endDrag(){
  const {card,ghost,ph}=drag;
  const list=ph.parentElement; const toCol=state.columns.find(c=>c.id===list.dataset.col);
  const siblings=[...list.children].filter(n=>n!==card);
  const toIdx=siblings.indexOf(ph);
  const f=findCard(card.dataset.id);
  f.col.cards.splice(f.idx,1);
  toCol.cards.splice(Math.max(0,toIdx),0,f.card);
  ghost.remove(); drag=null; clearInterval(autoTimer);
  board.style.scrollSnapType=""; board.style.overflowX="";
  document.removeEventListener("touchmove",blockTouch);
  document.removeEventListener("pointermove",onDragMove);
  save(); render();
  dragJustEnded=true; setTimeout(()=>dragJustEnded=false,300);
}
board.addEventListener("contextmenu",e=>e.preventDefault());

render();
})();
</script>
</body>
</html>
