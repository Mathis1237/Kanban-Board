name: APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK bauen
        run: gradle assembleRelease --no-daemon

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk Kanban.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Kanban-APK
          path: Kanban.apk

      - name: Als Release zum Download bereitstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Kanban (neueste Version)
          files: Kanban.apk
          make_latest: true
